<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="JoyDM — your own private, lightweight, self-hosted music streaming player." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>JoyDM</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Primary">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="28" height="28" fill="none">
              <circle cx="16" cy="16" r="15" fill="url(#joydm-g)" />
              <path d="M18.6 8.4v11.2a3.3 3.3 0 1 1-2.2-3.12V11l6.4-1.6v2.1l-4.2 1.05Z" fill="#fff" />
              <defs>
                <linearGradient id="joydm-g" x1="0" y1="0" x2="32" y2="32">
                  <stop stop-color="#7c5cff" />
                  <stop offset="1" stop-color="#ff5c8a" />
                </linearGradient>
              </defs>
            </svg>
          </span>
          <span class="brand__name">JoyDM</span>
        </div>

        <nav class="nav" id="sidebar-nav" aria-label="Library"></nav>

        <div class="sidebar__footer" id="sidebar-footer"></div>
      </aside>

      <div class="main-area">
        <header class="topbar" id="topbar">
          <button class="icon-btn topbar__menu" id="sidebar-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" /></svg>
          </button>

          <a class="topbar__history" id="history-back" href="#" aria-label="Go back" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
          </a>

          <form class="search" id="global-search" role="search" autocomplete="off">
            <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
            <input
              class="search__input"
              id="search-input"
              type="search"
              placeholder="Search songs, artists, albums, genres…"
              aria-label="Search"
              enterkeyhint="search"
            />
            <kbd class="search__kbd" aria-hidden="true">/</kbd>
          </form>

          <div class="topbar__actions">
            <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme">
              <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7" /></svg>
              <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
            </button>
            <button class="icon-btn" id="user-menu-btn" type="button" aria-label="Account" aria-haspopup="true" aria-expanded="false">
              <span class="avatar" id="user-avatar" aria-hidden="true">J</span>
            </button>
          </div>
        </header>

        <main class="content" id="main" tabindex="-1"></main>
      </div>
    </div>

    <section class="player-bar" id="player-bar" aria-label="Player" hidden></section>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile"></nav>

    <aside class="queue-drawer" id="queue-drawer" aria-label="Queue" aria-hidden="true"></aside>

    <div class="sheet-root" id="sheet-root"></div>
    <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="true"></div>
    <div class="context-menu-root" id="context-menu-root"></div>

    <div class="scrim" id="scrim" hidden></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
