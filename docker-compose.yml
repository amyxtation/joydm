services:
  joydm:
    build: .
    image: joydm:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      DATABASE_PATH: /data/music.db
      MUSIC_LIBRARY_PATH: /music-library
      LOG_PATH: /logs
      # Required — put SESSION_SECRET in .env next to this file:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      PRIVATE_MODE: "true"
      SCAN_ON_STARTUP: "false"
    volumes:
      # SQLite database + artwork cache (writable).
      - ./data:/data
      # Your music — mounted read-only so the app can never modify it (PRD §128).
      - ./music-library:/music-library:ro
      - ./logs:/logs
    # Uncomment to publish directly without Caddy (e.g. behind an existing proxy).
    # ports:
    #   - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - joydm
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # e.g. JOYDM_HOST=music.example.com and ACME_EMAIL=you@example.com
      JOYDM_HOST: ${JOYDM_HOST:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
